name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AICHATHUB_CATALOG_PUBLIC_KEY: ${{ secrets.AICHATHUB_CATALOG_PUBLIC_KEY }}
        run: ./gradlew assembleRelease

      - name: Sign APK with uber-apk-signer
        run: |
          curl -L -o uber-apk-signer.jar https://github.com/nicbot/nicbot/releases/download/uber-apk-signer-1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar \
            --ks ${{ github.workspace }}/release.keystore \
            --ksPass "${{ secrets.KEYSTORE_PASSWORD }}" \
            --ksKeyPass "${{ secrets.KEY_PASSWORD }}" \
            --ksAlias "${{ secrets.KEY_ALIAS }}" \
            --apks app/build/outputs/apk/release/*.apk \
            --out app/build/outputs/apk/signed/

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AiChatHub ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/signed/*.apk
          draft: false
          prerelease: false

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
