# gitleaks configuration for AI Chat Hub
#
# Extends the default rule set and allow-lists the ONLY places in this repo
# where credential-shaped strings exist: environment-variable NAMES read by
# the CI signing config and the log-redaction REGEXES in the crash logger.
# Neither file contains any secret VALUE — real secrets live exclusively in
# GitHub Actions secrets (KEYSTORE_*, AICHATHUB_CATALOG_PUBLIC_KEY).
#
# If a real secret ever needs to exist in these files, move it into CI
# secrets instead of enlarging this allow-list.

[extend]
useDefault = true

[allowlist]
description = """
Code that references credential NAMES, not values: env-var lookups in the
Gradle signing config and redaction regexes in CrashLogRepository.
"""
paths = [
  '''app/build\.gradle\.kts''',
  '''app/src/main/java/com/aichathub/app/privacy/CrashLogRepository\.kt''',
]
